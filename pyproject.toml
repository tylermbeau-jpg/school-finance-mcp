[project]
name = "school-finance-mcp"
version = "0.2.0"
description = "MCP server for California SACS account-string validation and school-meal reimbursement"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tyler Beauregard" }]
keywords = ["mcp", "model-context-protocol", "streamable-http", "school-finance", "sacs", "k-12", "california"]
dependencies = ["mcp>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
school-finance-mcp = "school_finance_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["school_finance_mcp"]
